[project]
name = "codex-orchestration"
version = "0.8.0"
description = "A cross-platform orchestration kit for Codex custom subagents"
requires-python = ">=3.9"
license = { text = "MIT" }

[project.optional-dependencies]
dev = [
  "pyright>=1.1.400",
  "ruff>=0.12.0",
]

[tool.ruff]
target-version = "py39"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pyright]
pythonVersion = "3.9"
include = ["scripts", "hooks", "tests"]
