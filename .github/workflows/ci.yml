name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        os: [macos-latest, windows-latest]
        python: ["3.9", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install "ruff>=0.12.0" "pyright>=1.1.400"
      - run: python scripts/validate.py
      - run: python -m unittest discover -s tests -v
      - run: ruff check .
      - run: ruff format --check .
      - run: pyright
      - if: runner.os == 'macOS'
        run: bash -n skills/diagnosing-bugs/scripts/hitl-loop.template.sh
      - if: runner.os == 'Windows'
        shell: pwsh
        run: "[void][scriptblock]::Create((Get-Content -Raw 'skills/diagnosing-bugs/scripts/hitl-loop.template.ps1'))"
